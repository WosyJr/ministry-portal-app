<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; script-src 'self'">
<title>Ministry Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fondamento&family=EB+Garamond:wght@400;500;600&display=swap">
<style>
  :root{--ink:#F0E2C4;--dim:#9C8A6E;--faint:#8B7A60;--gold:#B89656;--blood:#6B1414;--rail:#1B1309;--bar:#211709;--edge:#2A1F14}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:#14100B;color:var(--ink);font-family:"EB Garamond",Garamond,Georgia,serif;user-select:none}
  button{font-family:inherit;color:inherit;background:transparent;border:none;cursor:pointer}

  #rail{position:fixed;left:0;top:0;bottom:0;width:74px;background:var(--rail);border-right:1px solid var(--edge);
    display:flex;flex-direction:column;align-items:center;padding:10px 0 12px;-webkit-app-region:drag}
  #rail button{-webkit-app-region:no-drag}
  .seal{width:40px;height:40px;border-radius:50%;background:var(--blood);border:1px solid var(--gold);
    display:flex;align-items:center;justify-content:center;margin-bottom:18px;flex:none}
  .railbtn{position:relative;width:46px;height:46px;margin-bottom:6px;border-radius:3px;display:flex;align-items:center;justify-content:center}
  .railbtn:hover{background:#2C1E10}
  .railbtn.on{background:#2C1E10}
  .railbtn .mark{position:absolute;left:-14px;top:11px;bottom:11px;width:3px;border-radius:0 2px 2px 0;background:var(--gold);opacity:0}
  .railbtn.on .mark{opacity:1}
  .railbtn svg{stroke:var(--faint)}
  .railbtn.on svg,.railbtn:hover svg{stroke:var(--ink)}
  .pip{position:absolute;top:4px;right:8px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#8A1E1E;
    color:#FBF3E0;font-size:11px;font-family:system-ui,sans-serif;display:none;align-items:center;justify-content:center}
  .pip.show{display:flex}
  .grow{flex:1 1 auto}

  #bar{position:fixed;left:74px;right:0;top:0;height:54px;background:var(--bar);border-bottom:1px solid var(--edge);
    display:flex;align-items:center;justify-content:space-between;padding:0 0 0 18px;gap:16px;-webkit-app-region:drag}
  #bar button,#bar .nodrag{-webkit-app-region:no-drag}
  .where{display:flex;align-items:center;gap:11px;min-width:0}
  .hall{font-family:Fondamento,Georgia,serif;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .right{display:flex;align-items:center;gap:12px;flex:none;height:100%}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:6px 11px;border-radius:2px;white-space:nowrap}
  .chip.ok{color:#A8D4B4;background:#1C2E1F;border:1px solid #2F4A34}
  .chip.held{color:#E8C99A;background:#30230F;border:1px solid #4C3A1B}
  .chip.down{color:#E8A9A2;background:#331614;border:1px solid #4E2320}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .iconbtn{position:relative;width:36px;height:36px;border:1px solid #3A2C19;background:var(--rail);border-radius:2px;display:flex;align-items:center;justify-content:center}
  .iconbtn:hover{background:#2C1E10}
  .iconbtn .pip{top:-6px;right:-6px}
  .who{display:flex;align-items:center;gap:10px;padding-left:13px;border-left:1px solid #3A2C19;max-width:230px}
  .avatar{width:30px;height:30px;border-radius:50%;background:#4A3C28;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:13px;color:#E8D5A8;flex:none}
  .whoname{font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .whorank{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wbtns{display:flex;height:54px;margin-left:4px}
  .wbtn{width:46px;height:54px;color:var(--dim);font-size:13px;display:flex;align-items:center;justify-content:center}
  .wbtn:hover{background:#2C1E10;color:var(--ink)}
  .wbtn.x:hover{background:#8A1E1E;color:#FBF3E0}

  #foot{position:fixed;left:74px;right:0;bottom:0;height:30px;background:var(--rail);border-top:1px solid var(--edge);
    display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:11px;color:var(--faint);gap:16px}
  #foot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bump{position:fixed;right:16px;bottom:44px;max-width:330px;background:#F1E6CC;color:#2B1B0E;border:1px solid #8C6A2F;
    border-radius:3px;padding:16px 18px;display:none}
  #bump.show{display:block}
  #bump h3{margin:0 0 7px;font-family:Fondamento,Georgia,serif;font-weight:400;font-size:19px;color:var(--blood)}
  #bump p{margin:0 0 12px;font-size:14px;line-height:1.5;color:#5A4128}
  #bump .row{display:flex;gap:8px}
  #bump button{font-size:14px;padding:9px 16px;min-height:40px;border-radius:2px}
  #bump .go{background:var(--blood);color:#F1E6CC}
  #bump .no{border:1px solid #8C6A2F;color:#5A4128}
  #load{position:fixed;left:74px;right:0;top:54px;height:2px;background:transparent;overflow:hidden}
  #load.on::after{content:"";display:block;height:2px;width:36%;background:var(--gold);animation:slide 1.1s infinite ease-in-out}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(380%)}}
</style>
</head>
<body>

<nav id="rail" aria-label="The Ministries">
  <div class="seal" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#E8D5A8"><path d="M12 2l1.6 7.4L21 11l-7.4 1.6L12 20l-1.6-7.4L3 11l7.4-1.6L12 2z"/></svg>
  </div>
  <div id="railbtns"></div>
  <div class="grow"></div>
  <button class="railbtn" id="settings" aria-label="Settings" title="Settings">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg>
  </button>
</nav>

<header id="bar">
  <div class="where">
    <button class="iconbtn nodrag" id="back" aria-label="Back" title="Back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9B183" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div style="min-width:0">
      <div class="hall" id="hall">The Imperial Ministries</div>
      <div class="sub" id="sub">Opening the hall</div>
    </div>
  </div>
  <div class="right">
    <span class="chip ok" id="archives"><span class="dot"></span><span id="archtext">Archives answering</span></span>
    <button class="iconbtn nodrag" id="letters" aria-label="Letters" title="Letters">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C9B183" stroke-width="1.6"><path d="M3 6h18v12H3z"/><path d="m3 7 9 6 9-6"/></svg>
      <span class="pip" id="letterpip">0</span>
    </button>
    <div class="who nodrag" id="who" style="display:none">
      <div class="avatar" id="initials">&nbsp;</div>
      <div style="min-width:0">
        <div class="whoname" id="whoname"></div>
        <div class="whorank" id="whorank"></div>
      </div>
    </div>
    <div class="wbtns">
      <button class="wbtn" id="min" aria-label="Minimise">&#8211;</button>
      <button class="wbtn" id="max" aria-label="Maximise">&#9633;</button>
      <button class="wbtn x" id="close" aria-label="Close">&#10005;</button>
    </div>
  </div>
</header>

<div id="load"></div>

<footer id="foot">
  <span id="site">Connected</span>
  <span id="status"></span>
</footer>

<div id="bump" role="status">
  <h3>A new version is ready</h3>
  <p id="bumptext">It will be in place the next time you open the Ministry.</p>
  <div class="row">
    <button class="go" id="restart">Restart now</button>
    <button class="no" id="later">Later</button>
  </div>
</div>

<script src="shell.js"></script>
</body>
</html>
